server {
    listen 80;
    listen [::]:80;
    server_name vocaboom.cyberlab.bond;

    root /var/www/vocaboom;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vocaboom.cyberlab.bond;

    root /var/www/vocaboom;

    ssl_certificate /etc/letsencrypt/live/vocaboom.cyberlab.bond/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vocaboom.cyberlab.bond/privkey.pem;

    location /api/ {
        proxy_pass http://172.17.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://172.17.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://172.17.0.1:18000/health;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
